# T-Display-P4-Air nRF9151 开发板专用配置。
# 本文件叠加在 ncs-serial-modem/app/prj.conf 基础配置之上。

# 开发板没有 DTR 和 RI 信号，UART0 在应用运行期间保持可用。
CONFIG_DTR_UART=n

# GNSS LNA 电源使能端（U30 EN）通过 R41 连接到 nRF9151 COEX0。
# 虽然 GNSS 天线使用 IPEX 接口，但 ONBOARD 选项会为 GNSS 频段配置 COEX0，
# 因此本硬件必须使用该选项。
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_ONBOARD=y

# 完整 Modem 固件升级需要外部 Flash，但本 nRF9151 电路没有该器件。
# 应用升级和 Modem Delta 固件升级仍可使用 Serial Modem 提供的内部 Flash 配置。
CONFIG_SM_FULL_FOTA=n
CONFIG_SM_DFU_MODEM_FULL=n
