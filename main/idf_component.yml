dependencies:
  lvgl/lvgl:
    version: "9.4.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL_TOUCH_DRAW} == True"

  espressif/esp_codec_dev:
    version: "^1.5.4"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ES8388} == True"

  espressif/esp_hosted:
    version: "2.11.5"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ESP_HOSTED_MCU_SDIO_WIFI} == True"

  espressif/esp_wifi_remote:
    version: "1.3.2"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ESP_HOSTED_MCU_SDIO_WIFI} == True"
